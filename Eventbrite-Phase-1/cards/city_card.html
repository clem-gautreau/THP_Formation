<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Ville - Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="row">
      <!-- Carte Ville -->
      <div class="col-md-4 mb-4">
        <div class="card city-card h-100">
          <img src="https://via.placeholder.com/400x250" class="card-img-top" alt="Paris">
          <div class="card-body">
            <h5 class="card-title" style="font-family: 'Patrick Hand', cursive; color: #FF6B35;">Paris</h5>
            <p class="card-text text-muted">
              <i class="fas fa-building mr-2"></i> 12 concours en cours
            </p>
          </div>
          <div class="card-footer bg-transparent">
            <a href="#" class="btn btn-primary btn-block" style="background-color: #FF6B35; border: none; font-weight: bold;">
              Voir les concours <i class="fas fa-arrow-right ml-2"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
