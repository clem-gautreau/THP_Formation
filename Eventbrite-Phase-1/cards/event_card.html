<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Événement - Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="row">
      <!-- Carte Événement -->
      <div class="col-md-4 mb-4">
        <div class="card event-card h-100">
          <div class="position-relative">
            <img src="https://via.placeholder.com/400x250" class="card-img-top" alt="Concours Paysages">
            <span class="badge badge-pill badge-primary position-absolute" style="top: 10px; left: 10px; background-color: #FF6B35;">
              Nouveau
            </span>
          </div>
          <div class="card-body">
            <h5 class="card-title" style="font-family: 'Patrick Hand', cursive; color: #FF6B35;">Concours : Paysages</h5>
            <p class="card-text text-muted mb-3">
              <i class="fas fa-calendar-alt mr-2"></i> Date limite : 20 mai 2026
            </p>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <p class="mb-0">
                <i class="fas fa-users mr-2"></i> 45 participants
              </p>
              <p class="mb-0">
                <i class="fas fa-trophy mr-2"></i> Tablette graphique
              </p>
            </div>
          </div>
          <div class="card-footer bg-transparent">
            <a href="#" class="btn btn-primary btn-block" style="background-color: #FF6B35; border: none; font-weight: bold;">
              Participer <i class="fas fa-paint-brush ml-2"></i>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
