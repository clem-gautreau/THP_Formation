<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carte Utilisateur - Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="row">
      <!-- Carte Utilisateur (horizontale) -->
      <div class="col-md-12 mb-4">
        <div class="card user-card">
          <div class="row no-gutters">
            <div class="col-md-3">
              <img src="https://via.placeholder.com/150" class="card-img rounded-circle mx-auto d-block mt-3" alt="Jean Dupont">
            </div>
            <div class="col-md-9">
              <div class="card-body">
                <h5 class="card-title" style="font-family: 'Patrick Hand', cursive; color: #FF6B35;">Jean Dupont</h5>
                <p class="card-text text-muted">
                  <i class="fas fa-paint-brush mr-2"></i> 8 dessins soumis
                </p>
                <p class="card-text">
                  <small class="text-muted">Membre depuis 2025</small>
                </p>
                <a href="#" class="btn btn-primary" style="background-color: #FF6B35; border: none; font-weight: bold;">
                  Voir le profil <i class="fas fa-user ml-2"></i>
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
