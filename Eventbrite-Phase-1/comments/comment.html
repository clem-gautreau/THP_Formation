<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Molécule Commentaire - Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <!-- Molécule : Un seul commentaire -->
    <div class="media mb-4">
      <img src="https://via.placeholder.com/60" class="mr-3 rounded-circle" alt="Photo de profil de Jean Dupont"
        style="width: 50px; height: 50px; object-fit: cover;">
      <div class="media-body">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h5 class="mt-0" style="font-family: 'Open Sans', sans-serif; font-weight: 600;">Jean Dupont</h5>
          <small class="text-muted">Il y a 2 heures</small>
        </div>
        <p class="mb-1" style="font-family: 'Open Sans', sans-serif; color: #4A4A4A;">
          Super concours ! J'adore le thème des paysages. Je vais essayer de participer avec un dessin de montagne.
        </p>
        <div class="d-flex">
          <a href="#" class="text-muted mr-3" style="font-size: 0.9rem;">
            <i class="fas fa-reply mr-1"></i> Répondre
          </a>
          <a href="#" class="text-muted" style="font-size: 0.9rem;">
            <i class="fas fa-heart mr-1"></i> 5
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
