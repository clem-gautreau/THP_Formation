<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grande Bannière - Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Petite bannière -->
  <div class="py-5" style="background-color: #f8f9fa; border-bottom: 1px solid #e0e0e0;">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-md-8">
          <h1 class="display-5" style="font-family: 'Patrick Hand', cursive; color: #FF6B35;">Soumettre un dessin</h1>
          <p class="lead" style="color: #4A4A4A;">Partage ton talent avec le monde.</p>
        </div>
        <div class="col-md-4 text-center">
          <i class="fas fa-paint-brush fa-5x" style="color: #FF6B35;"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

</html>
