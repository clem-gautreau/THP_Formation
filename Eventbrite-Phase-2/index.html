<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil - Kit UI Concours Dessin</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <!-- Thème Sketchy -->
  <link rel="stylesheet" href="https://bootswatch.com/4/sketchy/bootstrap.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Open+Sans&display=swap" rel="stylesheet">
  <!-- Ton CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    .card-link {
      transition: transform 0.3s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card-link:hover {
      transform: translateY(-5px);
      text-decoration: none;
    }
    .card-link .card {
      border: none;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }
    .card-link .card-body {
      padding: 1.5rem;
    }
    .card-link .card-title {
      font-family: 'Patrick Hand', cursive;
      color: #FF6B35;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
    <div class="container">
      <a class="navbar-brand" href="#" style="font-family: 'Patrick Hand', cursive; color: #FF6B35; font-size: 1.8rem;">
        <i class="fas fa-palette mr-2"></i> Kit UI - Concours Dessin
      </a>
    </div>
  </nav>

  <div class="container">
    <h1 class="text-center mb-5" style="font-family: 'Patrick Hand', cursive; color: #FF6B35; font-size: 2.5rem;">
      Bienvenue dans ton Kit UI
    </h1>

    <div class="row">
      <!-- Carte pour les Atomes -->
      <div class="col-md-4 mb-4">
        <a href="atoms.html" class="card-link">
          <div class="card">
            <div class="card-body text-center">
              <i class="fas fa-atom fa-3x mb-3" style="color: #FF6B35;"></i>
              <h4 class="card-title">Atomes</h4>
              <p class="card-text text-muted">Éléments de base : boutons, formulaires, badges...</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Carte pour les Molécules -->
      <div class="col-md-4 mb-4">
        <a href="molecules.html" class="card-link">
          <div class="card">
            <div class="card-body text-center">
              <i class="fas fa-layer-group fa-3x mb-3" style="color: #FF6B35;"></i>
              <h4 class="card-title">Molécules</h4>
              <p class="card-text text-muted">Composants réutilisables : cartes, commentaires...</p>
            </div>
          </div>
        </a>
      </div>

      <!-- Carte pour les Organismes -->
      <div class="col-md-4 mb-4">
        <a href="organisms.html" class="card-link">
          <div class="card">
            <div class="card-body text-center">
              <i class="fas fa-puzzle-piece fa-3x mb-3" style="color: #FF6B35;"></i>
              <h4 class="card-title">Organismes</h4>
              <p class="card-text text-muted">Sections complexes : navbar, footer, bannières...</p>
            </div>
          </div>
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts JS -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
