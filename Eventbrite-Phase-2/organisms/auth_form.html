        <!-- Formulaire de connexion - version allégée -->
<div class="card shadow">
  <div class="card-body p-4">
    <!-- En-tête -->
    <div class="text-center mb-4">
      <h2 class="card-title" style="font-family: 'Patrick Hand', cursive; color: #FF6B35;">Connexion</h2>
      <p class="text-muted">Connecte-toi pour participer aux concours.</p>
    </div>

    <!-- Formulaire -->
    <form>
      <!-- Champ Email -->
      <div class="form-group">
        <label for="email">Adresse email</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
          </div>
          <input type="email" class="form-control" id="email" placeholder="ton@email.com" required>
        </div>
      </div>

      <!-- Champ Mot de passe -->
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <div class="input-group">
          <div class="input-group-prepend">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
          </div>
          <input type="password" class="form-control" id="password" placeholder="Ton mot de passe" required>
        </div>
      </div>

      <!-- Lien "Mot de passe oublié ?" -->
      <div class="text-right mb-3">
        <a href="#" class="text-muted" style="font-size: 0.9rem;">Mot de passe oublié ?</a>
      </div>

      <!-- Bouton de soumission -->
      <button type="submit" class="btn btn-primary btn-block" style="background-color: #FF6B35; border: none; font-weight: bold;">
        Se connecter
      </button>

      <!-- Lien vers l'inscription -->
      <div class="text-center mt-3">
        <p class="text-muted mb-0">Pas encore de compte ?</p>
        <a href="#" class="text-primary" style="color: #FF6B35 !important;">S'inscrire</a>
      </div>
    </form>
  </div>
</div>
